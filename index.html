html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ivory);font-family:var(--f-ui);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--night)}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.cop{font-family:var(--f-cop)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;display:block}
/* Liquid Glass (à la iOS 26), en CSS compatible Safari : verre translucide qui floute et ravive le fond,
   liseré lumineux de lentille sur les bords, reflet spéculaire en haut, petit effet « gélatine » à l'appui. */
.glass,.gbtn,.xb,.bb.on,.chip,.gear,.s-btn:not(.pri),.h-actions .btn:not(.pri),.chip-c,.sbox{
  position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 60%,rgba(255,255,255,.07)),rgba(28,22,18,.3);
  -webkit-backdrop-filter:blur(16px) saturate(1.9) brightness(1.08);backdrop-filter:blur(16px) saturate(1.9) brightness(1.08);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.5),inset 0 -1px 1px rgba(255,255,255,.1),inset 1px 0 1px rgba(255,255,255,.08),inset -1px 0 1px rgba(255,255,255,.08),
    inset 0 0 14px rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.3);
  transition:transform .45s cubic-bezier(.3,1.6,.5,1),background .3s,box-shadow .3s}
.glass::before,.gbtn::before,.xb::before,.bb.on::before,.chip::before,.gear::before,.s-btn:not(.pri)::before,.h-actions .btn:not(.pri)::before,.chip-c::before,.sbox::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 75% at 22% -15%,rgba(255,255,255,.32),transparent 46%),radial-gradient(80% 60% at 100% 125%,rgba(255,255,255,.12),transparent 55%)}
.glass::after,.gbtn::after,.xb::after,.bb.on::after,.chip::after,.gear::after,.s-btn:not(.pri)::after,.h-actions .btn:not(.pri)::after,.sbox::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from 200deg,rgba(255,255,255,.55),rgba(255,255,255,.06) 22%,rgba(255,255,255,.3) 48%,rgba(255,255,255,.05) 74%,rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass:active,.gbtn:active,.xb:active,.chip:active,.gear:active,.s-btn:active,.h-actions .btn:active{transform:scale(1.06);transition-duration:.15s}
#mini:active{transform:scale(1.02)}
.xb.on{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.78));color:#1a130d}
.tab.on{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:inset 0 1px .5px rgba(255,255,255,.45),inset 0 0 0 .5px rgba(255,255,255,.12)}

/* ---------- Écrans ---------- */
#screen{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(170px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.brand{font-family:var(--f-cop);color:var(--gold);font-size:17px;letter-spacing:.02em}
.cdate{font-size:12.5px;color:var(--muted);margin-top:3px}
.gear{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.01em;margin:10px 0 14px;text-wrap:balance}
.lead{color:var(--muted);margin:-8px 0 18px;max-width:40ch}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}
.sh h2{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
.sh button{color:var(--gold);font-size:14px}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:34px}

.art{position:relative;overflow:hidden;flex:none;display:grid;place-items:center;container-type:inline-size;color:var(--ink);
  background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.art .gl{font-family:var(--f-lettrine);font-size:54cqi;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.art .xc{position:absolute;right:7%;bottom:7%;width:16%;height:16%;opacity:.45}
.art.xs{width:40px;height:40px;border-radius:8px}
.art.sm{width:48px;height:48px;border-radius:8px}
.art.md{width:100%;aspect-ratio:1;border-radius:12px}
.art.xl{width:min(62vw,230px);aspect-ratio:1;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45)}

.season{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:var(--ink);
  background:radial-gradient(120% 90% at 10% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(150deg,var(--c1),var(--c2))}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.s-name{font-family:var(--f-display);font-size:32px;line-height:1.1;margin-top:6px;text-wrap:balance}
.s-desc{font-size:14px;opacity:.85;margin-top:6px;max-width:30ch}
.s-word{position:absolute;right:-6px;bottom:-14px;font-family:var(--f-cop);font-size:82px;line-height:1;opacity:.13;pointer-events:none;white-space:nowrap}
.s-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.s-btn{height:40px;padding:0 16px;border-radius:99px;color:#f6ecd9;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.s-btn.pri{background:#f6ecd9;color:var(--on-gold)}
.s-next{margin-top:14px;font-size:13px;opacity:.85}

.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:none;width:140px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;min-width:0}
.card .c1{font-size:14px;font-weight:550}
.card .c2{font-size:12.5px;color:var(--muted)}
.chan{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;text-align:center;scroll-snap-align:start}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-size:28px;color:var(--gold);
  background:radial-gradient(circle at 30% 25%,#4b3a2a,#1e1712);box-shadow:inset 0 0 0 1px rgba(219,176,102,.35)}
.av.lg{width:150px;height:150px;font-size:50px}
.av.sm{width:44px;height:44px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;font-size:14px}
.chip small{color:var(--faint);margin-left:4px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{position:relative;overflow:hidden;border-radius:16px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);
  background:radial-gradient(120% 90% at 10% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(150deg,var(--c1),var(--c2))}
.pt-glyph{position:absolute;right:-2px;top:-12px;font-family:var(--f-lettrine);font-size:96px;line-height:1;opacity:.16;pointer-events:none}
.pt-word{font-family:var(--f-cop);font-size:14px;opacity:.85}
.pt-name{font-family:var(--f-display);font-size:19px;line-height:1.15;text-wrap:balance;display:block}
.pt-date{font-size:12px;opacity:.82;margin-top:4px;display:block}
.badge{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.4);color:#f6ecd9;padding:3px 8px;border-radius:99px}

.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .meta{flex:1;min-width:0}
.t1{font-size:15.5px}
.t1 .cop,.c1 .cop,.tt1 .cop{font-size:1.16em;line-height:1}
.t2{font-size:13px;color:var(--muted);margin-top:2px}
.row.is-cur .t1{color:var(--gold)}
.num{width:24px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;display:grid;place-items:center}
.dur{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.nosnd{font-size:10px;letter-spacing:.04em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.fav{width:36px;height:36px;display:grid;place-items:center;color:var(--faint);flex:none}
.fav.on{color:var(--gold)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:40%;background:var(--gold);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{50%{height:100%}}
body:not(.playing) .eq i{animation-play-state:paused}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);margin:0 -4px;padding:6px 0}
.backb{display:inline-flex;align-items:center;gap:2px;color:var(--gold);font-size:16px;height:36px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 14px}
.h-title{font-size:27px;margin:18px 0 2px}
.h-sub{color:var(--gold);font-size:15px}
.h-desc{color:var(--muted);font-size:14px;max-width:34ch;margin:8px 0 0;line-height:1.45}
.h-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;background:var(--raised);font-weight:600;font-size:15px;color:var(--gold)}
.btn.pri{background:var(--gold);color:var(--on-gold)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;line-height:1.5}

.lrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;font-size:17px;cursor:pointer}
.lrow .ic{color:var(--gold)}
.lrow .cnt{margin-left:auto;color:var(--faint);font-size:14px}
.sbox{display:flex;align-items:center;gap:8px;border-radius:14px;padding:0 12px;color:var(--muted);height:44px}
.sbox input{flex:1;min-width:0;background:none;border:0;color:var(--ivory);font:inherit;font-size:16px;outline:none}
.sbox input::placeholder{color:var(--faint)}

/* Réglages, façon iOS */
.grp-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:26px 4px 8px}
.grp{background:var(--surface);border-radius:14px;overflow:hidden}
.gr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;border-bottom:1px solid var(--line);width:100%;font-size:16px}
.gr:last-child{border-bottom:0}
.gr small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.gr .val{color:var(--faint);font-size:15px}
.grp-f{font-size:13px;color:var(--faint);margin:8px 4px 0;line-height:1.4}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2px;flex:none}
.seg button{padding:5px 12px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--gold)}

/* ---------- Dock : mini-lecteur + onglets flottants ---------- */
.dock-fade{position:fixed;left:0;right:0;bottom:0;height:calc(160px + env(safe-area-inset-bottom,0px));z-index:29;pointer-events:none;
  background:linear-gradient(rgba(15,12,10,0),rgba(15,12,10,.9) 62%)}
#dock{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(14px,env(safe-area-inset-left,0px))}
#dock > *{pointer-events:auto}
#mini{height:58px;border-radius:29px;display:flex;align-items:center;gap:10px;padding:0 6px 0 9px;cursor:pointer;position:relative;overflow:hidden}
#mini .art{width:40px;height:40px;border-radius:9px}
#mini .meta{flex:1;min-width:0}
#mini .t1{font-size:14.5px;font-weight:600}
#mini .t2{font-size:12.5px}
.mprog{position:absolute;left:24px;right:24px;bottom:0;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.mprog i{display:block;height:100%;width:0;background:var(--gold)}
.mbtn{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:50%}
.mbtn:active{background:rgba(255,255,255,.1)}
.tabrow{display:flex;gap:10px;align-items:center}
.tabcap{flex:1;display:grid;grid-template-columns:repeat(3,1fr);height:62px;border-radius:31px;padding:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ivory);border-radius:27px;transition:background .25s,color .25s}
.tab.on{color:var(--gold);background:rgba(255,255,255,.1)}
.srch{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ivory)}
.srch.on{color:var(--gold)}

/* ---------- Lecteur plein écran ---------- */
#player{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:50;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;color:#fff;background:#120d0a;
  transform:translateY(102%);visibility:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),visibility 0s linear .5s;
  padding-top:calc(env(safe-area-inset-top,0px) + 2px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#player.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.32,.72,0,1),visibility 0s}
.p-bg{position:absolute;inset:-25%;z-index:-2;filter:blur(64px) saturate(1.35)}
.p-bg i{position:absolute;width:75%;height:60%;border-radius:50%}
.p-bg i:nth-child(1){left:0;top:0;background:var(--c1);animation:d1 21s ease-in-out infinite alternate}
.p-bg i:nth-child(2){right:0;top:18%;background:var(--c2);animation:d2 27s ease-in-out infinite alternate}
.p-bg i:nth-child(3){left:8%;bottom:0;background:var(--c3);animation:d3 31s ease-in-out infinite alternate}
.p-bg i:nth-child(4){right:4%;bottom:8%;background:var(--c4);animation:d1 35s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(28%,22%) scale(1.2)}}
@keyframes d2{to{transform:translate(-32%,14%) scale(.9)}}
@keyframes d3{to{transform:translate(18%,-26%) scale(1.15)}}
#player:not(.open) .p-bg i{animation-play-state:paused}
.p-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,var(--shade,.22)),rgba(0,0,0,calc(var(--shade,.22) + .2)))}
.p-grab{order:0;height:24px;display:grid;place-items:center;flex:none;width:100%}
.p-grab span{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.42)}

#pTop{order:1;display:none;align-items:center;gap:12px;padding:6px 0 10px;flex:none}
#player[data-view="lyrics"] #pTop,#player[data-view="queue"] #pTop{display:flex}
#pTop .art{width:58px;height:58px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tt{flex:1;min-width:0}
.tt1{font-size:17px;font-weight:650}
.tt2{font-size:15px;color:rgba(255,255,255,.62);margin-top:1px}
.gbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.gbtn.on{color:var(--gold)}
.gbtn:active{background:rgba(255,255,255,.28)}

#pBody{order:2;flex:1;min-height:0;position:relative;display:flex;flex-direction:column;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}}
.p-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.p-art .art{width:min(100%,48vh,420px);aspect-ratio:1;border-radius:12px;box-shadow:0 26px 60px rgba(0,0,0,.45);transition:transform .7s cubic-bezier(.34,1.42,.64,1),box-shadow .5s}
body:not(.playing) .p-art .art{transform:scale(.8);box-shadow:0 12px 30px rgba(0,0,0,.35)}

#pCtl{order:3;flex:none;display:flex;flex-direction:column;transition:opacity .4s ease,transform .4s ease}
#player[data-view="lyrics"] #pCtl{position:absolute;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
#player.ctl-hidden[data-view="lyrics"] #pCtl{opacity:0;transform:translateY(18px);pointer-events:none}
#pTitle{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#player:not([data-view="art"]) #pTitle{display:none}
#pTitle .tt1{font-size:20px}
#pTitle .tt2{font-size:19px}
.scrub{height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline-offset:4px}
.sc-track{position:relative;width:100%;height:7px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;transition:height .2s ease}
.sc-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.72)}
.sc-loop{position:absolute;top:0;bottom:0;background:rgba(219,176,102,.65);mix-blend-mode:screen}
.scrub.active .sc-track{height:12px}
.scrub.active .sc-fill{background:#fff}
.p-times{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;margin-top:-1px;min-height:18px}
.chip-c{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:7px;color:rgba(255,255,255,.78);max-width:46%}
.p-main{display:flex;justify-content:space-evenly;align-items:center;height:92px}
.pc{position:relative;width:76px;height:76px;display:grid;place-items:center;color:#fff;border-radius:50%}
.pc svg{position:relative}
.pc::before{content:"";position:absolute;inset:2px;border-radius:50%;background:rgba(255,255,255,.18);transform:scale(.5);opacity:0;transition:transform .3s,opacity .3s}
.pc:active::before{transform:scale(1);opacity:1}
.p-extras{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.p-extras:empty{display:none}
.xb{height:34px;padding:0 13px;border-radius:17px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.xb.on{background:rgba(255,255,255,.88);color:#1a130d}
.p-bottom{display:flex;justify-content:space-between;align-items:center;padding:2px 22px 0;height:48px}
.bb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.62);transition:background .25s,color .25s}
.bb.on{color:#fff}

/* Paroles façon Apple Music Sing */
.lyr{position:relative;flex:1;min-height:0;overflow:hidden;margin:0 -6px;padding:0 6px;cursor:grab;
  -webkit-mask-image:linear-gradient(transparent 0,#000 7%,#000 50%,transparent 68%);mask-image:linear-gradient(transparent 0,#000 7%,#000 50%,transparent 68%)}
#player.ctl-hidden .lyr,#player.syncing .lyr{-webkit-mask-image:linear-gradient(transparent 0,#000 7%,#000 84%,transparent);mask-image:linear-gradient(transparent 0,#000 7%,#000 84%,transparent)}
.lyr-in{position:relative}
.ln{padding:12px 0 18px;transform-origin:0 50%;filter:blur(calc(var(--dist,1) * .6px));will-change:transform;
  transition:transform .85s var(--spring),filter .5s ease}
.ln.now{filter:none}

/* Stockage durable de l'audio : on copie les octets dans un Blob neuf (le fichier choisi dans Fichiers
   n'est qu'une copie temporaire qu'iOS efface), on l'écrit dans IndexedDB et on relit pour vérifier.
   Si IndexedDB refuse, on se rabat sur le stockage Cache du navigateur. */
const AUDIO_CACHE = 'psalmodia-audio';
async function saveAudio(id, blob, name) {
  try {
    await DB.put(id, { blob, type: blob.type, name, size: blob.size });
    const back = await DB.get(id);
    if (back && back.blob && back.blob.size === blob.size) return true;
  } catch (e) {}
  try {
    const c = await caches.open(AUDIO_CACHE);
    await c.put('audio/' + encodeURIComponent(id), new Response(blob, { headers: { 'Content-Type': blob.type || 'audio/mp4' } }));
    const r = await c.match('audio/' + encodeURIComponent(id));
    if (r) return true;
  } catch (e) {}
  return false;
}
// Un chant importé avant que l'appli ne le connaisse a été créé sous le nom de son fichier :
// on rattache son audio au bon chant du catalogue et on retire le doublon.
async function migrateCustom() {
  let moved = 0;
  for (const rec of CUSTOM.slice()) {
    const id = matchTrack(rec.ti); if (!id) continue;
    try {
      const v = await DB.get(rec.id), mine = await DB.get(id);
      if (v && !mine) await DB.put(id, v);
      await DB.del(rec.id);
    } catch (e) { continue; }
    CUSTOM.splice(CUSTOM.indexOf(rec), 1);
    const i = TRACKS.findIndex(t => t.id === rec.id); if (i >= 0) TRACKS.splice(i, 1);
    delete TR[rec.id]; delete META[rec.id]; S.fav.delete(rec.id);
    moved++;
  }
  if (moved) { store.set('custom', CUSTOM); store.set('meta', META); store.set('fav', [...S.fav]); toast(`${moved} chant${moved > 1 ? 's' : ''} rattaché${moved > 1 ? 's' : ''} au catalogue, avec leurs paroles`); }
}
async function loadStoredAudio() {
  await loadStoredAudioInner();
  if (S.cfg.autoDl && navigator.onLine !== false && missing().length) downloadMissing();
}
async function loadStoredAudioInner() {
  await migrateCustom();
  let n = 0, bytes = 0;
  try {
    for (const k of (await DB.keys()) || []) {
      const v = await DB.get(k); if (!v || !TR[k]) continue;
      const b = v.blob && v.blob.size ? v.blob : v.buf ? new Blob([v.buf], { type: v.type || 'audio/mp4' }) : null;
      if (b) { setSrc(k, b); n++; bytes += b.size; }
    }
  } catch (e) {}
  try {
    const c = await caches.open(AUDIO_CACHE);
    for (const req of await c.keys()) {
      const id = decodeURIComponent(new URL(req.url).pathname.split('/audio/')[1] || '');
      if (!TR[id] || TR[id].src) continue;
      const b = await (await c.match(req)).blob(); setSrc(id, b); n++; bytes += b.size;
    }
  } catch (e) {}
  S.stored = { n, bytes };
  render(true);
}
/* ---------- Téléchargement des chants en ligne (pour l'écoute hors connexion) ---------- */
const DL = { active: false, i: 0, n: 0, got: 0, cur: 0, total: 0, name: '' };
const missing = () => TRACKS.filter(t => t.remote && !t.src);
const missingBytes = () => missing().reduce((a, t) => a + (t.size || 0), 0);
async function downloadMissing() {
  if (DL.active) return;
  const list = missing(); if (!list.length) return;
  Object.assign(DL, { active: true, i: 0, n: list.length, got: 0, cur: 0, total: missingBytes(), name: '' });
  let ok = 0, fail = 0;
  for (const tr of list) {
    DL.i++; DL.name = tr.ti; DL.cur = 0; dlUpdate(true);
    try {
      const res = await fetch(tr.remote, { cache: 'no-store' });
      if (!res.ok || !res.body) throw new Error(res.status);
      const reader = res.body.getReader(), parts = [];
      for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); DL.cur += value.length; dlUpdate(); }
      const blob = new Blob(parts, { type: 'audio/mp4' });
      if (await saveAudio(tr.id, blob, tr.id + '.m4a')) { setSrc(tr.id, blob); ok++; } else fail++;
    } catch (e) { fail++; }
    DL.got += tr.size || DL.cur; DL.cur = 0;
  }
  DL.active = false; await loadStoredCount(); render(true);
  toast(fail ? `${ok} téléchargé${ok > 1 ? 's' : ''}, ${fail} en échec : ils seront retentés à la prochaine ouverture` : `${ok} chant${ok > 1 ? 's' : ''} téléchargé${ok > 1 ? 's' : ''} : prêt${ok > 1 ? 's' : ''} hors connexion`);
}
function dlHTML() {
  if (DL.active) {
    const pct = Math.round(Math.min(1, (DL.got + DL.cur) / (DL.total || 1)) * 100);
    return `<div class="dlcard glass" id="dlCard"><div class="dl-h"><b>Téléchargement des chants</b><span>${DL.i} / ${DL.n}</span></div><div class="pbar"><i style="width:${pct}%"></i></div><div class="dl-s ell">${pct} % · ${esc(DL.name)}</div></div>`;
  }
  const m = missing(); if (!m.length) return '';
  return `<div class="dlcard glass" id="dlCard"><div class="dl-h"><b>${m.length} chant${m.length > 1 ? 's' : ''} à garder hors connexion</b><span>${mo(missingBytes())}</span></div><div class="dl-s">Ils se lisent déjà en ligne. Télécharge-les pour les écouter partout, même sans réseau.</div><button class="btn pri" data-act="dl">Télécharger</button></div>`;
}
let dlT = 0;
function dlUpdate(force) {
  const now = performance.now(); if (!force && now - dlT < 200) return; dlT = now;
  const c = $('#dlCard'); if (c) c.outerHTML = dlHTML();
}
const mo = b => (b / 1048576).toLocaleString('fr-FR', { maximumFractionDigits: b < 1e8 ? 1 : 0 }) + ' Mo';
let importing = false;
function progressHTML(done, total, pct, name) {
  return `<div class="form"><h3>Importation des chants</h3>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pinfo"><b>${pct} %</b><span>${done} / ${total}</span></div>
    <div class="pname ell">${esc(name)}</div>
    <p class="grp-f">Garde l'appli ouverte pendant l'enregistrement.</p></div>`;
}
async function importFiles(files) {
  importing = true;
  const total = files.reduce((a, f) => a + f.size, 0) || 1;
  let doneBytes = 0, savedBytes = 0; const ok = [], failed = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i], base = f.name.replace(/\.[^.]+$/, '');
    openSheet(progressHTML(i, files.length, Math.round(doneBytes / total * 100), f.name));
    let id = attachTarget || matchTrack(base);
    if (!id) {
      id = 'u' + Date.now().toString(36) + i;
      CUSTOM.push({ id, ti: base }); store.set('custom', CUSTOM);
      const t = { id, ti: base, cop: '', p: 'annuel', ch: null, dur: 0, user: true }; TRACKS.push(t); addTrack(t);
    }
    let blob = null;
    try { blob = new Blob([await f.arrayBuffer()], { type: f.type || 'audio/mp4' }); } catch (e) {}
    if (blob && await saveAudio(id, blob, f.name)) { ok.push(id); savedBytes += blob.size; setSrc(id, blob); }
    else { failed.push(f.name); setSrc(id, f); }
    doneBytes += f.size;
  }
  attachTarget = null; importing = false;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  openSheet(`<div class="form center"><div class="okbig">${ic(ok.length ? 'check' : 'warn', 32)}</div>
    <h3>${ok.length ? `${ok.length} chant${ok.length > 1 ? 's' : ''} enregistré${ok.length > 1 ? 's' : ''} dans l'appli` : 'Aucun chant enregistré'}</h3>
    ${ok.length ? `<p class="grp-f">${mo(savedBytes)} copiés sur cet iPhone et vérifiés. Ils restent après la fermeture de l'appli, même sans connexion.</p>` : ''}
    ${failed.length ? `<p class="warn">Pas pu enregistrer ${failed.length} fichier${failed.length > 1 ? 's' : ''} (espace plein ?) : ${failed.slice(0, 3).map(esc).join(', ')}${failed.length > 3 ? '…' : ''}. Ils se lisent jusqu'à la fermeture.</p>` : ''}
    <button class="btn pri" data-act="closesheet">OK</button></div>`);
  render(true);
  loadStoredCount();
}
async function loadStoredCount() {
  let n = 0, bytes = 0;
  try { for (const k of (await DB.keys()) || []) { const v = await DB.get(k); const b = v && (v.blob || v.buf); if (b) { n++; bytes += b.size || b.byteLength || 0; } } } catch (e) {}
  try { const c = await caches.open(AUDIO_CACHE); for (const req of await c.keys()) { n++; bytes += (await (await c.match(req)).blob()).size; } } catch (e) {}
  S.stored = { n, bytes };
}
loadStoredAudio();

/* ---------- Feuilles ---------- */

  <button class="mi" data-act="rate" data-keep="1">Vitesse<span class="val">${num(S.rate)}×</span></button>

  <button class="mi" data-act="edit" data-id="${tr.id}">Modifier les infos${ic('pencil')}</button>
  <button class="mi" data-act="goto" data-type="period" data-id="${tr.p}" data-close="1">Voir « ${P.name} »${ic('calendar')}</button>
  ${CH[tr.ch] ? `<button class="mi" data-act="goto" data-type="chanter" data-id="${tr.ch}" data-close="1">Voir ${esc(CH[tr.ch].name)}${ic('person')}</button>` : ''}
  <button class="mi" data-act="goto" data-type="settings" data-id="s" data-close="1">Réglages du lecteur${ic('gear')}</button>`;
}
function editHTML(id) {
  const tr = TR[id];
  return `<form class="form" id="editForm" data-id="${id}"><h3>Modifier les infos</h3>
    <label>Titre<input id="fTi" value="${esc(tr.ti)}" required></label>

    <label>Chantre<select id="fCh"><option value="">Inconnu</option>${Object.entries(CH).map(([k, c]) => `<option value="${k}"${tr.ch === k ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}<option value="__new">Nouveau chantre…</option></select></label>
    <label id="fNewWrap" hidden>Nom du chantre<input id="fNew" placeholder="Prénom Nom"></label>
    <label>Office<select id="fOf"><option value="">Aucun</option>${Object.entries(OFFICES).map(([k, n]) => `<option value="${k}"${tr.of === k ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="sy-btns"><button type="button" class="btn" data-act="closesheet">Annuler</button><button type="submit" class="btn pri">Enregistrer</button></div></form>`;
}
document.addEventListener('change', e => { if (e.target.id === 'fCh') $('#fNewWrap').hidden = e.target.value !== '__new'; });
document.addEventListener('submit', e => {
  if (e.target.id !== 'editForm') return;
  e.preventDefault();
  const id = e.target.dataset.id, tr = TR[id];

  }

/* ---------- Interactions ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function openPlayer() { if (!S.cur) return; S.full = true; $('#player').classList.add('open'); document.body.classList.add('locked'); renderPBody(); updateUI(); pokeControls(); }
function closePlayer() { S.full = false; $('#player').classList.remove('open', 'ctl-hidden'); document.body.classList.remove('locked'); }
function setFav(id) {
  if (S.fav.has(id)) { S.fav.delete(id); toast('Retiré des favoris'); } else { S.fav.add(id); toast('Ajouté aux favoris'); }
  store.set('fav', [...S.fav]); render(true); if (S.cur) { const v = S.pview; renderPlayer(); S.pview = v; }
}
function setCfg(k, v) { S.cfg[k] = v; store.set('cfg', S.cfg); render(true); updateUI(); if (S.full && S.pview === 'lyrics') { renderPBody(); } pokeControls(); }

$('#player').addEventListener('pointerdown', () => pokeControls(), true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (performance.now() - suppressClick < 400 && e.target.closest('#lyr')) return;
  const a = el.dataset.act;
  if (el.dataset.close) closeSheet();
  switch (a) {
    case 'tab': S.route = { tab: el.dataset.tab, stack: [] }; render(); break;
    case 'open': S.route.stack.push({ type: el.dataset.type, id: el.dataset.id }); render(); break;
    case 'back': S.route.stack.pop(); render(); break;
    case 'goto': closePlayer(); if (el.dataset.type !== 'settings') S.route = { tab: 'periods', stack: [] }; S.route.stack.push({ type: el.dataset.type, id: el.dataset.id }); render(); break;
    case 'play': playList(el.dataset.list, +el.dataset.i || 0, false); break;
    case 'shufplay': playList(el.dataset.list, 0, true); break;
    case 'fav': setFav(el.dataset.id); break;
    case 'openp': if (!e.target.closest('.mbtn')) openPlayer(); break;
    case 'closep': closePlayer(); break;
    case 'toggle': toggle(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'menu': openSheet(menuHTML()); break;
    case 'closesheet': if (!importing) closeSheet(); break;
    case 'edit': openSheet(editHTML(el.dataset.id)); break;
    case 'shuffle':
      S.shuffle = !S.shuffle;
      if (S.shuffle) S.queue = [...S.queue.slice(0, S.qi + 1), ...shuffled(S.queue.slice(S.qi + 1))];
      updateUI(); if (S.pview === 'queue') renderPBody(); toast(S.shuffle ? 'Lecture aléatoire activée' : 'Lecture aléatoire désactivée'); break;
    case 'repeat': S.repeat = (S.repeat + 1) % 3; updateUI(); if (S.pview === 'queue') renderPBody(); toast(['Répétition désactivée', 'Répéter la liste', 'Répéter ce chant'][S.repeat]); break;
    case 'view': setView(S.pview === el.dataset.v ? 'art' : el.dataset.v); break;
    case 'rate':
      S.rate = RATES[(RATES.indexOf(S.rate) + 1) % RATES.length];
      if (au(curTrack())) A.playbackRate = S.rate;
      updateUI(); toast(S.rate < 1 ? `Ralenti à ${num(S.rate)}×, la voix garde sa hauteur` : `Vitesse ${num(S.rate)}×`); break;
    case 'loop':
      if (S.loopA == null) { S.loopA = S.t; toast('Point A placé. Touche encore pour placer B.'); }
      else if (S.loopB == null) { if (S.t <= S.loopA + 0.5) { toast('Place B un peu après A'); break; } S.loopB = S.t; seek(S.loopA); toast('Boucle active : ce passage se répète'); }
      else { S.loopA = S.loopB = null; toast('Boucle désactivée'); }
      updateUI(); break;
    case 'airplay':
      if (au(curTrack()) && A.webkitShowPlaybackTargetPicker) A.webkitShowPlaybackTargetPicker();
      else toast(au(curTrack()) ? 'AirPlay s’ouvre depuis le Centre de contrôle sur cet appareil' : 'AirPlay marche dès que le chant a son fichier audio');
      break;
    case 'sync': startSync(); break;
    case 'stap': syncTap(); break;
    case 'ssyl': syncSyl(); break;
    case 'sundo': syncUndo(); break;
    case 'sdone': syncDone(); break;
    case 'squit': S.sync = null; renderPBody(); updateUI(); pokeControls(); toast('Synchronisation annulée'); break;
    case 'cfg': setCfg(el.dataset.k, !S.cfg[el.dataset.k]); break;
    case 'lsz': setCfg('lsize', +el.dataset.v); break;
    case 'wseek': {
      if (S.sync) break;
      const w = activeL(curTrack()).v[+el.dataset.vi].w[+el.dataset.wi];
      if (w.t != null) { e.stopPropagation(); resetLyrScroll(); seek(w.t); if (!S.playing) play(); }
      break;
    }
    case 'lseek': {
      if (S.sync || !LY) break;
      const s = itemStart(LY.items[+el.dataset.ii], activeL(curTrack()));
      if (s != null) { resetLyrScroll(); seek(s); if (!S.playing) play(); }
      break;
    }
    case 'qjump': S.qi = +el.dataset.i; load(S.queue[S.qi]); play(); renderPBody(); render(true); break;
    case 'dl': downloadMissing(); break;
    case 'import': attachTarget = null; $('#importInput').click(); break;
    case 'attach': attachTarget = el.dataset.id; $('#importInput').click(); break;
    case 'exportsync': {
      const out = {}; TRACKS.forEach(t => { const s = store.get('sync2:' + t.id, null); if (s) out[t.id] = s; });
      const txt = JSON.stringify(out);
      if (!Object.keys(out).length) { toast('Aucun minutage enregistré pour l’instant'); break; }
      const fallback = () => openSheet(`<div class="form"><h3>Mes minutages</h3><label>Copie ce texte et envoie-le-moi<textarea readonly id="expTxt">${esc(txt)}</textarea></label></div>`);
      try { navigator.clipboard.writeText(txt).then(() => toast('Minutages copiés, colle-les dans la conversation'), fallback); } catch (x) { fallback(); }
      break;
    }
  }
});
function resetLyrScroll() { clearTimeout(returnT); if (LY) { LY.manual = 0; const b = $('#lyr'); if (b) b.classList.remove('free'); } }
document.addEventListener('keydown', e => {

(() => {
