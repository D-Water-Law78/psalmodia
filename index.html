:root{
  /* Layout : colonne iPhone (≤ 480px), écrans qui défilent, mini-lecteur et barre d'onglets flottants en verre, lecteur plein écran façon Apple Music. Thème sombre assumé : or d'icône sur nuit de cierge. */
  --night:#0f0c0a; --surface:#1a1512; --raised:#272019; --ivory:#f3e9d6; --muted:#a7988a; --faint:#7a6d61; --gold:#dbb066; --on-gold:#1b140c;
  --line:rgba(243,233,214,.09);
  --hi:#ffffff; --lo:rgba(255,255,255,.34);
  --f-display:"Marcellus","Iowan Old Style",Georgia,serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,sans-serif;

  --spring:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ivory);font-family:var(--f-ui);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--night)}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.cop{font-family:var(--f-cop)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;display:block}
.glass{background:rgba(42,35,29,.62);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.1),0 10px 28px rgba(0,0,0,.4)}

/* ---------- Écrans ---------- */
#screen{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(170px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.brand{font-family:var(--f-cop);color:var(--gold);font-size:17px;letter-spacing:.02em}
.cdate{font-size:12.5px;color:var(--muted);margin-top:3px}
.gear{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--raised)}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.01em;margin:10px 0 14px;text-wrap:balance}
.lead{color:var(--muted);margin:-8px 0 18px;max-width:40ch}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}
.sh h2{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
.sh button{color:var(--gold);font-size:14px}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:34px}

.art{position:relative;overflow:hidden;flex:none;display:grid;place-items:center;container-type:inline-size;color:var(--ink);
  background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.art .gl{font-family:var(--f-lettrine);font-size:54cqi;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.art .xc{position:absolute;right:7%;bottom:7%;width:16%;height:16%;opacity:.45}
.art.xs{width:40px;height:40px;border-radius:8px}
.art.sm{width:48px;height:48px;border-radius:8px}
.art.md{width:100%;aspect-ratio:1;border-radius:12px}
.art.xl{width:min(62vw,230px);aspect-ratio:1;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45)}

.season{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:var(--ink);
  background:radial-gradient(120% 90% at 10% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(150deg,var(--c1),var(--c2))}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.s-name{font-family:var(--f-display);font-size:32px;line-height:1.1;margin-top:6px;text-wrap:balance}
.s-desc{font-size:14px;opacity:.85;margin-top:6px;max-width:30ch}
.s-word{position:absolute;right:-6px;bottom:-14px;font-family:var(--f-cop);font-size:82px;line-height:1;opacity:.13;pointer-events:none;white-space:nowrap}
.s-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.s-btn{height:40px;padding:0 16px;border-radius:99px;background:rgba(0,0,0,.28);color:#f6ecd9;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.s-btn.pri{background:#f6ecd9;color:var(--on-gold)}
.s-next{margin-top:14px;font-size:13px;opacity:.85}

.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:none;width:140px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;min-width:0}
.card .c1{font-size:14px;font-weight:550}
.card .c2{font-size:12.5px;color:var(--muted)}
.chan{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;text-align:center;scroll-snap-align:start}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-size:28px;color:var(--gold);
  background:radial-gradient(circle at 30% 25%,#4b3a2a,#1e1712);box-shadow:inset 0 0 0 1px rgba(219,176,102,.35)}
.av.lg{width:150px;height:150px;font-size:50px}
.av.sm{width:44px;height:44px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--raised);font-size:14px}
.chip small{color:var(--faint);margin-left:4px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{position:relative;overflow:hidden;border-radius:16px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);
  background:radial-gradient(120% 90% at 10% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(150deg,var(--c1),var(--c2))}
.pt-glyph{position:absolute;right:-2px;top:-12px;font-family:var(--f-lettrine);font-size:96px;line-height:1;opacity:.16;pointer-events:none}
.pt-word{font-family:var(--f-cop);font-size:14px;opacity:.85}
.pt-name{font-family:var(--f-display);font-size:19px;line-height:1.15;text-wrap:balance;display:block}
.pt-date{font-size:12px;opacity:.82;margin-top:4px;display:block}
.badge{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.4);color:#f6ecd9;padding:3px 8px;border-radius:99px}

.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .meta{flex:1;min-width:0}
.t1{font-size:15.5px}
.t1 .cop,.c1 .cop,.tt1 .cop{font-size:1.16em;line-height:1}
.t2{font-size:13px;color:var(--muted);margin-top:2px}
.row.is-cur .t1{color:var(--gold)}
.num{width:24px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;display:grid;place-items:center}
.dur{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.nosnd{font-size:10px;letter-spacing:.04em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.fav{width:36px;height:36px;display:grid;place-items:center;color:var(--faint);flex:none}
.fav.on{color:var(--gold)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:40%;background:var(--gold);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{50%{height:100%}}
body:not(.playing) .eq i{animation-play-state:paused}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);margin:0 -4px;padding:6px 0}
.backb{display:inline-flex;align-items:center;gap:2px;color:var(--gold);font-size:16px;height:36px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 14px}
.h-title{font-size:27px;margin:18px 0 2px}
.h-sub{color:var(--gold);font-size:15px}
.h-desc{color:var(--muted);font-size:14px;max-width:34ch;margin:8px 0 0;line-height:1.45}
.h-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;background:var(--raised);font-weight:600;font-size:15px;color:var(--gold)}
.btn.pri{background:var(--gold);color:var(--on-gold)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;line-height:1.5}

.lrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;font-size:17px;cursor:pointer}
.lrow .ic{color:var(--gold)}
.lrow .cnt{margin-left:auto;color:var(--faint);font-size:14px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--raised);border-radius:12px;padding:0 12px;color:var(--muted);height:44px}
.sbox input{flex:1;min-width:0;background:none;border:0;color:var(--ivory);font:inherit;font-size:16px;outline:none}
.sbox input::placeholder{color:var(--faint)}

/* Réglages, façon iOS */
.grp-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:26px 4px 8px}
.grp{background:var(--surface);border-radius:14px;overflow:hidden}
.gr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;border-bottom:1px solid var(--line);width:100%;font-size:16px}
.gr:last-child{border-bottom:0}
.gr small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.gr .val{color:var(--faint);font-size:15px}
.grp-f{font-size:13px;color:var(--faint);margin:8px 4px 0;line-height:1.4}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2px;flex:none}
.seg button{padding:5px 12px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--gold)}

/* ---------- Dock : mini-lecteur + onglets flottants ---------- */
.dock-fade{position:fixed;left:0;right:0;bottom:0;height:calc(160px + env(safe-area-inset-bottom,0px));z-index:29;pointer-events:none;
  background:linear-gradient(rgba(15,12,10,0),rgba(15,12,10,.9) 62%)}
#dock{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(14px,env(safe-area-inset-left,0px))}
#dock > *{pointer-events:auto}
#mini{height:58px;border-radius:29px;display:flex;align-items:center;gap:10px;padding:0 6px 0 9px;cursor:pointer;position:relative;overflow:hidden}
#mini .art{width:40px;height:40px;border-radius:9px}
#mini .meta{flex:1;min-width:0}
#mini .t1{font-size:14.5px;font-weight:600}
#mini .t2{font-size:12.5px}
.mprog{position:absolute;left:24px;right:24px;bottom:0;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.mprog i{display:block;height:100%;width:0;background:var(--gold)}
.mbtn{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:50%}
.mbtn:active{background:rgba(255,255,255,.1)}
.tabrow{display:flex;gap:10px;align-items:center}
.tabcap{flex:1;display:grid;grid-template-columns:repeat(3,1fr);height:62px;border-radius:31px;padding:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ivory);border-radius:27px;transition:background .25s,color .25s}
.tab.on{color:var(--gold);background:rgba(255,255,255,.1)}
.srch{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ivory)}
.srch.on{color:var(--gold)}

/* ---------- Lecteur plein écran ---------- */
#player{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:50;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;color:#fff;background:#120d0a;
  transform:translateY(102%);visibility:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),visibility 0s linear .5s;
  padding-top:calc(env(safe-area-inset-top,0px) + 2px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#player.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.32,.72,0,1),visibility 0s}
.p-bg{position:absolute;inset:-25%;z-index:-2;filter:blur(64px) saturate(1.35)}
.p-bg i{position:absolute;width:75%;height:60%;border-radius:50%}
.p-bg i:nth-child(1){left:0;top:0;background:var(--c1);animation:d1 21s ease-in-out infinite alternate}
.p-bg i:nth-child(2){right:0;top:18%;background:var(--c2);animation:d2 27s ease-in-out infinite alternate}
.p-bg i:nth-child(3){left:8%;bottom:0;background:var(--c3);animation:d3 31s ease-in-out infinite alternate}
.p-bg i:nth-child(4){right:4%;bottom:8%;background:var(--c4);animation:d1 35s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(28%,22%) scale(1.2)}}
@keyframes d2{to{transform:translate(-32%,14%) scale(.9)}}
@keyframes d3{to{transform:translate(18%,-26%) scale(1.15)}}
#player:not(.open) .p-bg i{animation-play-state:paused}
.p-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,var(--shade,.22)),rgba(0,0,0,calc(var(--shade,.22) + .2)))}
.p-grab{order:0;height:24px;display:grid;place-items:center;flex:none;width:100%}
.p-grab span{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.42)}

#pTop{order:1;display:none;align-items:center;gap:12px;padding:6px 0 10px;flex:none}
#player[data-view="lyrics"] #pTop,#player[data-view="queue"] #pTop{display:flex}
#pTop .art{width:58px;height:58px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tt{flex:1;min-width:0}
.tt1{font-size:17px;font-weight:650}
.tt2{font-size:15px;color:rgba(255,255,255,.62);margin-top:1px}
.gbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);color:#fff;flex:none}
.gbtn.on{color:var(--gold)}
.gbtn:active{background:rgba(255,255,255,.28)}

#pBody{order:2;flex:1;min-height:0;position:relative;display:flex;flex-direction:column;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}}
.p-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.p-art .art{width:min(100%,48vh,420px);aspect-ratio:1;border-radius:12px;box-shadow:0 26px 60px rgba(0,0,0,.45);transition:transform .7s cubic-bezier(.34,1.42,.64,1),box-shadow .5s}
body:not(.playing) .p-art .art{transform:scale(.8);box-shadow:0 12px 30px rgba(0,0,0,.35)}

#pCtl{order:3;flex:none;display:flex;flex-direction:column;transition:opacity .4s ease,transform .4s ease}
#player[data-view="lyrics"] #pCtl{position:absolute;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
#player.ctl-hidden[data-view="lyrics"] #pCtl{opacity:0;transform:translateY(18px);pointer-events:none}
#pTitle{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#player:not([data-view="art"]) #pTitle{display:none}
#pTitle .tt1{font-size:20px}
#pTitle .tt2{font-size:19px}
.scrub{height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline-offset:4px}
.sc-track{position:relative;width:100%;height:7px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;transition:height .2s ease}
.sc-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.72)}
.sc-loop{position:absolute;top:0;bottom:0;background:rgba(219,176,102,.65);mix-blend-mode:screen}
.scrub.active .sc-track{height:12px}
.scrub.active .sc-fill{background:#fff}
.p-times{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;margin-top:-1px;min-height:18px}
.chip-c{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:5px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.78);max-width:46%}
.p-main{display:flex;justify-content:space-evenly;align-items:center;height:92px}
.pc{position:relative;width:76px;height:76px;display:grid;place-items:center;color:#fff;border-radius:50%}
.pc svg{position:relative}
.pc::before{content:"";position:absolute;inset:2px;border-radius:50%;background:rgba(255,255,255,.18);transform:scale(.5);opacity:0;transition:transform .3s,opacity .3s}
.pc:active::before{transform:scale(1);opacity:1}
.p-extras{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.p-extras:empty{display:none}
.xb{height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.13);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.xb.on{background:rgba(255,255,255,.88);color:#1a130d}
.p-bottom{display:flex;justify-content:space-between;align-items:center;padding:2px 22px 0;height:48px}
.bb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.62);transition:background .25s,color .25s}
.bb.on{background:rgba(255,255,255,.22);color:#fff}

/* Paroles façon Apple Music Sing */
.lyr{position:relative;flex:1;min-height:0;overflow:hidden;margin:0 -6px;padding:0 6px;cursor:grab;
  -webkit-mask-image:linear-gradient(transparent 0,#000 7%,#000 50%,transparent 68%);mask-image:linear-gradient(transparent 0,#000 7%,#000 50%,transparent 68%)}
#player.ctl-hidden .lyr,#player.syncing .lyr{-webkit-mask-image:linear-gradient(transparent 0,#000 7%,#000 84%,transparent);mask-image:linear-gradient(transparent 0,#000 7%,#000 84%,transparent)}
.lyr-in{position:relative}
.ln{padding:10px 0 14px;transform-origin:0 50%;scale:.96;filter:blur(calc(var(--dist,1) * .6px));will-change:transform;
  transition:transform .85s var(--spring),scale .55s ease,filter .5s ease}
.ln.now{scale:1;filter:none}
.lyr.free .ln{filter:none}
.lyr.dragging .ln{transition:none}
.vcop{font-family:var(--f-cop);font-weight:700;font-size:var(--lfs);line-height:1.28;display:flex;flex-wrap:wrap;column-gap:.3em;row-gap:.08em}
.vfr{font-weight:750;font-size:calc(var(--lfs) - 2px);line-height:1.2;letter-spacing:-.01em;display:flex;flex-wrap:wrap;column-gap:.26em}
.w{display:inline-block;cursor:pointer;transition:transform .75s var(--spring)}
.ln.now .w.up{transform:translateY(-.05em)}
.l,.u{display:inline-block;color:var(--lo);transition:transform .55s cubic-bezier(.34,1.5,.64,1),filter .55s ease}
.ln.now .l,.ln.now .u{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,var(--hi) calc(var(--p,0) * 140% - 40%),var(--lo) calc(var(--p,0) * 140%))}
.ln.now .f{--p:1}
.ln.now .l.c{transform:translateY(-.03em) scale(1.07)}
.ln.now .l.c.hold{transition:none;transform:translateY(calc(var(--p,0) * -.1em)) scale(calc(1.05 + var(--p,0) * .17));filter:drop-shadow(0 0 calc(var(--p,0) * 14px) rgba(255,255,255,.75))}
#player.no-emph .ln.now .l.c,#player.no-emph .ln.now .l.c.hold{transform:none;filter:none}
.tr{font-size:17px;font-weight:600;line-height:1.3;color:rgba(255,255,255,.3);margin-top:7px;transition:color .4s}
.ln.now .tr{color:rgba(255,255,255,.68)}
#player.no-tr .tr{display:none}
.lyr-note{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);padding-bottom:6px}
.ln.gap{height:46px;padding:14px 0 0}
.dots{display:inline-flex;gap:9px;transform-origin:0 50%;transition:transform .45s cubic-bezier(.34,1.5,.64,1),opacity .35s}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,calc(.28 + var(--d,0) * .72))}

function listIds(key) {

  if (k === 'col') return TRACKS.filter(t => t.col === id).map(t => t.id);

  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (S.full) closePlayer(); }
});
addEventListener('resize', () => placeLines(false));
$('#importInput').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; if (files.length) importFiles(files); });

// Glisser vers le bas pour réduire le lecteur
(() => {
  const pl = $('#player'); let y0 = null, dy = 0;
  pl.addEventListener('touchstart', e => { if (!e.target.closest('.p-grab,.p-art,#pTop,#pTitle')) return; y0 = e.touches[0].clientY; dy = 0; pl.style.transition = 'none'; }, { passive: true });
  pl.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); pl.style.transform = `translateY(${dy}px)`; }, { passive: true });
  pl.addEventListener('touchend', () => { if (y0 == null) return; pl.style.transition = ''; pl.style.transform = ''; if (dy > 110) closePlayer(); y0 = null; });
})();

/* ---------- Démarrage ---------- */
$('#tab-home').innerHTML = ic('home') + 'Accueil';
$('#tab-periods').innerHTML = ic('periods') + 'Périodes';
$('#tab-library').innerHTML = ic('library') + 'Bibliothèque';
$('#tab-search').innerHTML = ic('search', 24);
S.queue = listIds('period:annuel'); S.qi = 0; S.qFrom = PERIODS.annuel.name;
load('tenoueshet');
render();
requestAnimationFrame(tick);
if (document.querySelector('link[rel=manifest]') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
